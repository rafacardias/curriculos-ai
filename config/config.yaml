# Curriculos — configuração do operador
# Edite à vontade; tudo aqui é lido a cada execução (sem cache).

auto_search: on
auto_search_hour: 9 # hora local do dia para a busca automática

# Buscas rodadas pelo /buscar (e pelo modo automático)
#
# Trilha-alvo: ai-builder (automação · IA aplicada · growth/funil).
# Reescritas em 2026-08-06 — as anteriores eram de QA/Produto, herdadas de quando
# essa era a trilha, e por isso o acervo tinha 199 vagas de `product` contra 73 de
# `ai-builder`. O scorer já pontuava bem a trilha nova; ninguém ia buscá-la.
#
# Regra de forma: a Gupy busca por `jobName`, ou seja, casa contra o TÍTULO da
# vaga. Query tem de parecer título ("Analista de Automação"), não descrição de
# habilidade ("vibe coder", que não é cargo em lugar nenhum). Termos como
# `vibe coding`, `claude`, `n8n` e `manychat` moram no LÉXICO da trilha
# (profile/tracks.yaml), onde ranqueiam a vaga depois que ela chega.
#
# Roteamento: query em PT → Gupy/LinkedIn BR. Query em EN → boards remotos
# internacionais. Senioridade NÃO entra na query — quem faz esse corte é
# `filters.exclude_seniority`, que é mais confiável que a redação do anúncio.
searches:
  # ─── PT · Brasil ────────────────────────────────────────────────────────────
  - query: Analista de Automação
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: Automação de Marketing
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: Analista de CRM
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: Analista de Growth
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: Engenheiro de IA
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: Chatbot
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false
  - query: No-Code
    sources: [gupy, linkedin]
    location: Brazil
    remote_only: false

  # ─── EN · remoto internacional ──────────────────────────────────────────────
  - query: n8n
    sources: [remotive, remoteok, wwr]
    remote_only: true
  - query: AI automation
    sources: [remotive, remoteok, wwr]
    remote_only: true
  - query: automation engineer
    sources: [remotive, remoteok, wwr]
    remote_only: true
  - query: AI agent
    sources: [remotive, remoteok, wwr]
    remote_only: true
  - query: marketing automation
    sources: [remotive, remoteok, wwr]
    remote_only: true
  - query: no code developer
    sources: [remotive, remoteok, wwr]
    remote_only: true

queue_threshold: 40

# Filtros duros — vaga filtrada NÃO entra na fila (motivo fica no policy_action)
# exclude_seniority: intern | junior | mid | senior | lead | leadership
# Foco em vagas de entrada: pleno (PL/II) e acima ficam de fora.
filters:
  exclude_seniority:
    - mid
    - senior
    - lead
    - leadership
  max_years_required: 2 # exclui JD que exige mais anos que isso; null = sem limite
  # Palavras que, no título, filtram a vaga (palavra inteira, sem case/acento).
  # PL, II e III já são detectados como senioridade; use para termos extras (ex.: specialist, coordenador).
  exclude_title_keywords: []
  # Exigência de idioma NATIVO que você não fala = requisito eliminatório, e o
  # sistema não deve gastar uma geração nela. Medido em 2026-08-06: 2 vagas em 641,
  # ambas na fila, uma delas já com kit gerado ($3 e uma carta escrita à toa).
  # Português, inglês e espanhol ficam de fora da lista de propósito.
  # Tecnologias que você não tem hoje. Exigidas pelo JD = vaga eliminada.
  # Medido em 2026-08-07: `python` sozinho tira 20 das 33 vagas da fila. É uma
  # troca consciente — some a maior parte da fila, some também o retrabalho de
  # gerar kit para vaga que pede uma linguagem que você não escreve. Tire da lista
  # no dia em que aprender; é uma linha.
  blocking_technologies:
    - python

  # Presencial/híbrido fora de MG. Só filtra quando o adapter diz EXPLICITAMENTE
  # onsite/hybrid — `remote_type` nulo é ausência de informação, não prova de
  # presencial. Das 24 vagas "fora de MG e não-remotas" medidas em 2026-08-07, 16
  # eram NULL do LinkedIn e 5 delas mencionavam trabalho remoto no próprio texto.
  # Filtrar por ausência mataria vaga boa por falta de dado.
  exclude_onsite_outside_home_uf: true

  blocking_native_languages:
    - russian
    - russo
    - mandarin
    - mandarim
    - chinese
    - chinês
    - german
    - alemão
    - french
    - francês
    - italian
    - italiano
    - japanese
    - japonês
    - dutch
    - holandês
    - polish
    - polonês
    - ukrainian
    - ucraniano
    - arabic
    - árabe
    - hebrew
    - hebraico
    - korean
    - coreano
    - turkish
    - turco

# Pesos do score (soma das contribuições, normalizada para 0-100)
scoring:
  keyword_overlap: 0.65 # overlap keywords do JD × léxico da trilha (era 0.55; herdou o peso do preference)
  recency: 0.15 # vagas recentes valem mais
  # Piso do componente de recência. NÃO é uma opinião sobre frescor: é CALIBRAÇÃO.
  # O decaimento é linear em 21 dias, e a discriminação real do componente só
  # existe na janela de 0–21 dias — é lá que uma busca nova ranqueia vaga fresca
  # acima de vaga velha, e é para isso que ele serve. Fora dessa janela o
  # componente colapsa para 0 e some da escala: medido em 2026-08-06, com o acervo
  # parado 3,5 semanas, `recency` valia 0 para 374 de 374 vagas, ou seja, 15 pontos
  # de escala evaporados e os dois thresholds descalibrados sem ninguém mexer neles.
  # O piso devolve esses pontos de forma UNIFORME — não discrimina nada, e não
  # deveria. A alternativa avaliada (esticar a meia-vida para 90d) foi recusada
  # porque devolveria discriminação FALSA: daria 33% dos pontos a uma vaga de 60
  # dias, que provavelmente já foi preenchida.
  recency_floor: 0.4
  location_fit: 0.15 # remoto/local compatível
  language_fit: 0.05 # idioma do JD × idiomas do perfil
  # 0 até a atribuição de culpa do /feedback creditar o MOTIVO, não o vocabulário
  # do JD — ver KNOWN-BUGS.md BUG-007. Medido em 2026-08-06: kw:qa -7.65,
  # kw:product manager -9.50, seniority:junior -1.90, source:gupy -5.65. O
  # componente aprendeu a punir exatamente as trilhas e o nível do candidato.
  # NÃO voltar para 0.10 sem o BUG-007 corrigido: as 98 chaves seguem no banco.
  preference: 0

# Policy engine — quando gerar, quando submeter, em qual modo
policy:
  generate_min_score: 65
  full_auto_min_score: 80
  full_auto_blocked_sources: [ linkedin ]
  weekly_cap_per_track: 25
  prefer_responsive_companies: true
  cooldown_same_company_days: 30

# Modo de submissão por plataforma ATS (review_first|approve_batch|full_auto)
submission:
  default_mode: review_first
  per_platform:
    greenhouse: review_first
    lever: review_first
    workday: review_first
    linkedin: review_first
  # LinkedIn Easy Apply em full_auto usa sessão logada — risco real de bloqueio de conta.
  # Só é aceito se esta flag for explicitamente true:
  i_accept_ban_risk: false

# Experiment engine
experiments:
  enabled: true
  min_n_to_compare: 8 # mínimo de aplicações por variante antes de exibir comparação

# Aprendizado de preferências (feedback aprovar/rejeitar)
preferences:
  max_weight: 10 # cap por chave
  decay: 0.95 # decaimento aplicado a cada busca
auto_search_days:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6

# Perfis de harness — o que cada invocação de `claude -p` carrega.
#
# `model` é OBRIGATÓRIO em todo perfil e não tem default. `isolate_settings`
# passa `--setting-sources ""`, que derruba ~/.claude/settings.json inteiro,
# INCLUSIVE a chave `model` — sem `--model` explícito o disparo cai num default
# arbitrário. Aconteceu em 2026-08-07: rodou em opus-5 sem ninguém pedir, $0,45.
# Um teste falha se qualquer perfil daqui não produzir `--model` no argv.
#
# Medido (docs/custo-geracao.md): herdar tudo custa 80.824 tokens de prefixo por
# invocação; com tools vazio + system prompt próprio, 192.
#
# NÃO usar `effort: low` em redação: medido, corta 43% do custo mas REPROVA no
# truthcheck e derruba a cobertura de 30% para 20%. Barato e quebrado.
harness:
  profiles:
    redacao:
      model: claude-sonnet-5
      tools: [] # `--tools ""` — o corte que vale 63.926 tokens
      max_budget_usd: 1.00
    revisao:
      model: claude-sonnet-5
      tools: []
      max_budget_usd: 0.50
    salario:
      model: claude-sonnet-5
      tools: [WebSearch]
      max_budget_usd: 0.15
    chrome: # /linkedin* — único que precisa de MCP e das settings do usuário
      model: claude-sonnet-5
      tools: [Read, Write, Bash]
      strict_mcp: false
      disable_slash_commands: false
      isolate_settings: false
      max_budget_usd: 1.00
