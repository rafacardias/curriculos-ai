# Curriculos — configuração do operador
# Edite à vontade; tudo aqui é lido a cada execução (sem cache).

auto_search: on
auto_search_hour: 9 # hora local do dia para a busca automática

# Buscas rodadas pelo /buscar (e pelo modo automático)
# Estratégia: queries PT → Gupy/LinkedIn BR; queries EN → boards remotos internacionais.
# LinkedIn (guest) fica só nas 3 apostas principais para não estressar o endpoint.
searches:
  - query: QA Assistant Analist Junior associate
    sources:
      - remotive
      - remoteok
      - wwr
      - gupy
      - linkedin
    remote_only: true
  - query: quality assurance junior  associate
    sources:
      - remotive
      - remoteok
      - wwr
      - gupy
      - linkedin
    remote_only: true
  - query: Product Manager junior estágio
    sources:
      - gupy
      - linkedin
    location: Brazil
    remote_only: false
  - query: Product Owner estágio
    sources:
      - gupy
      - linkedin
    location: Belo Horizonte
    remote_only: false
  - query: associate product manager
    sources:
      - gupy
      - linkedin
    location: Belo Horizonte
    remote_only: false
  - query: Scrum Master estágio
    sources:
      - gupy
      - linkedin
    location: Belo Horizonte
    remote_only: false
  - query: n8n
    sources:
      - remotive
      - remoteok
      - wwr
      - gupy
      - linkedin
    remote_only: true
  - query: AI automation
    sources:
      - remotive
      - remoteok
      - wwr
      - gupy
      - linkedin
    remote_only: true
  - query: vibe coder
    sources:
      - remotive
      - remoteok
      - wwr
      - gupy
      - linkedin
    remote_only: true

# Threshold para uma vaga entrar na fila (score 0-100)
queue_threshold: 40

# Filtros duros — vaga filtrada NÃO entra na fila (motivo fica no policy_action)
# exclude_seniority: intern | junior | mid | senior | lead | leadership
# Foco em vagas de entrada: pleno (PL/II) e acima ficam de fora.
filters:
  exclude_seniority:
    - mid
    - senior
    - lead
    - leadership
  max_years_required: 2 # exclui JD que exige mais anos que isso; null = sem limite
  # Palavras que, no título, filtram a vaga (palavra inteira, sem case/acento).
  # PL, II e III já são detectados como senioridade; use para termos extras (ex.: specialist, coordenador).
  exclude_title_keywords: []

# Pesos do score (soma das contribuições, normalizada para 0-100)
scoring:
  keyword_overlap: 0.65 # overlap keywords do JD × léxico da trilha (era 0.55; herdou o peso do preference)
  recency: 0.15 # vagas recentes valem mais
  location_fit: 0.15 # remoto/local compatível
  language_fit: 0.05 # idioma do JD × idiomas do perfil
  # 0 até a atribuição de culpa do /feedback creditar o MOTIVO, não o vocabulário
  # do JD — ver KNOWN-BUGS.md BUG-007. Medido em 2026-08-06: kw:qa -7.65,
  # kw:product manager -9.50, seniority:junior -1.90, source:gupy -5.65. O
  # componente aprendeu a punir exatamente as trilhas e o nível do candidato.
  # NÃO voltar para 0.10 sem o BUG-007 corrigido: as 98 chaves seguem no banco.
  preference: 0

# Policy engine — quando gerar, quando submeter, em qual modo
policy:
  generate_min_score: 65
  full_auto_min_score: 80
  full_auto_blocked_sources: [ linkedin ]
  weekly_cap_per_track: 25
  prefer_responsive_companies: true
  cooldown_same_company_days: 30

# Modo de submissão por plataforma ATS (review_first|approve_batch|full_auto)
submission:
  default_mode: review_first
  per_platform:
    greenhouse: review_first
    lever: review_first
    workday: review_first
    linkedin: review_first
  # LinkedIn Easy Apply em full_auto usa sessão logada — risco real de bloqueio de conta.
  # Só é aceito se esta flag for explicitamente true:
  i_accept_ban_risk: false

# Experiment engine
experiments:
  enabled: true
  min_n_to_compare: 8 # mínimo de aplicações por variante antes de exibir comparação

# Aprendizado de preferências (feedback aprovar/rejeitar)
preferences:
  max_weight: 10 # cap por chave
  decay: 0.95 # decaimento aplicado a cada busca
auto_search_days:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
