# Cadastro de empresas vigiadas — ver src/core/companies-config.ts.
#
# `ats` só aceita o que company-watch.ts sabe buscar hoje (Fase A: só "gupy").
# `tracks` são ids de profile_tracks — sem duplicar léxico aqui.
#
# GPTW/BH confirmado nesta sessão (Localiza e Algar): investigação com WebSearch/
# WebFetch contra GPTW MG 2025/2026 e os respectivos boards de carreira, ver
# KNOWN-BUGS.md e o plano da feature.
#
# TOTVS removida: "totvs.gupy.io" é 404 de verdade (verificado ao vivo, não só
# "não confirmada em GPTW/BH" como a nota anterior dizia — 5 variações óbvias
# de handle também deram 404). Se um dia quiser incluir a TOTVS, precisa achar
# o handle certo primeiro — não adivinhar de novo.
#
# Bretas não tem board Gupy próprio: o handle que responde é o da holding que
# a controla (Cencosud Brasil), então o registro traz vagas de outras marcas
# do grupo também, não só da Bretas. Aceito deliberadamente (decisão do
# operador, 2026-08-09) — filtro de localização e o classificador determinístico
# de trilha já cobrem a maior parte do ruído, e é reversível numa linha (`enabled:
# false`) se incomodar depois. Ver docs/company-watch-candidates.md.

